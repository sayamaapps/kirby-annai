name: CI

on:
  # Feature branches are checked by the PR, main after the merge.
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # Runs pull requests only from branches of this repository: a pull request
    # from a fork is skipped (the push to the fork runs CI there). The workflow
    # needs no secrets; the guard keeps strangers' code off the runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dev dependencies (Kirby as fixture)
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      # The integration tests symlink the sibling packages into the throwaway
      # site when they exist (tests/helpers.php: ANNAI_NOREN_PATH,
      # ANNAI_KOYOMI_PATH). Without them the Noren and Koyomi checks print SKIP.
      - name: Fetch Noren and Koyomi as fixtures
        run: |
          git clone --depth 1 https://github.com/simsimmal/kirby-noren ../kirby-noren || true
          git clone --depth 1 https://github.com/simsimmal/kirby-koyomi ../kirby-koyomi || true

      - name: Tests
        run: sh tests/run.sh

  # Kirby 6 is a pre-release. This job runs the same tests against it so the
  # next major shows up early. It never fails the workflow, and Kirby 6 is
  # required only inside the job: composer.json and the tags stay on Kirby 5,
  # so nothing changes for a site that installs this plugin.
  kirby-6:
    name: Kirby 6 pre-release, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Kirby 6 supports PHP 8.3 to 8.5.
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      # platform.php resolves the dependencies for PHP 8.2, which Kirby 6 no
      # longer supports. ^6.0@beta installs the newest Kirby 6 release: a beta
      # or release candidate until the stable version is out.
      - name: Install dev dependencies with Kirby 6
        run: |
          composer config --unset platform.php
          composer require --dev 'getkirby/cms:^6.0@beta' --with-all-dependencies --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      # The integration tests symlink the sibling packages into the throwaway
      # site when they exist (tests/helpers.php: ANNAI_NOREN_PATH,
      # ANNAI_KOYOMI_PATH). Without them the Noren and Koyomi checks print SKIP.
      - name: Fetch Noren and Koyomi as fixtures
        run: |
          git clone --depth 1 https://github.com/simsimmal/kirby-noren ../kirby-noren || true
          git clone --depth 1 https://github.com/simsimmal/kirby-koyomi ../kirby-koyomi || true

      - name: Tests
        run: sh tests/run.sh
