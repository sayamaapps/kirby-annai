name: CI

on:
  # Feature branches are checked by the PR, main after the merge.
  push:
    branches: [main]
  pull_request:
  # A manual run checks a branch before its pull request exists.
  workflow_dispatch:

# A new push to the same PR cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.deps }}
    runs-on: ubuntu-latest
    # Runs pull requests only from branches of this repository: a pull request
    # from a fork is skipped (the push to the fork runs CI there). The workflow
    # needs no secrets; the guard keeps strangers' code off the runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # lowest: the oldest Kirby 5 and the oldest dependencies allowed by composer.json.
        # locked: the versions in composer.lock. highest: the newest versions allowed.
        deps: [lowest, locked, highest]
        include:
          # Kirby 6 needs PHP 8.3 or newer.
          - php: '8.3'
            deps: kirby-6
          - php: '8.4'
            deps: kirby-6
          - php: '8.5'
            deps: kirby-6
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's PHP reads the system zoneinfo; since 24.04 the backward-compatible
      # names (Europe/Kiev, US/Eastern) live in tzdata-legacy. Hosters keep them.
      - name: Legacy time zone names
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tzdata-legacy

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies, lowest versions
        if: matrix.deps == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable --ignore-platform-req=ext-gd

      - name: Install dependencies, locked versions
        if: matrix.deps == 'locked'
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Install dependencies, highest versions
        if: matrix.deps == 'highest'
        run: composer update --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      # platform.php resolves the dependencies for PHP 8.2, which Kirby 6 does
      # not support.
      - name: Install dependencies, Kirby 6
        if: matrix.deps == 'kirby-6'
        run: |
          composer config --unset platform.php
          composer require --dev 'getkirby/cms:^6.0' --with-all-dependencies --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      # The integration tests symlink the sibling packages into the throwaway
      # site when they exist (tests/helpers.php: ANNAI_NOREN_PATH,
      # ANNAI_KOYOMI_PATH). A failed clone fails this step: the Noren and Koyomi
      # checks must not be skipped in silence.
      - name: Fetch Noren and Koyomi as fixtures
        run: |
          git clone --depth 1 https://github.com/sayamaapps/kirby-noren ../kirby-noren
          git clone --depth 1 https://github.com/sayamaapps/kirby-koyomi ../kirby-koyomi

      - name: Tests
        run: vendor/bin/phpunit

  # The static checks run once, on PHP 8.4: PHP Mess Detector 2.x prints
  # deprecation notices on PHP 8.5.
  analysis:
    name: Analysis, PHP 8.4
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Composer validate
        run: composer validate --strict --no-check-version --no-check-all

      - name: Composer normalize
        run: composer normalize:check

      - name: Undeclared dependencies
        run: composer analyze:require-checker

      - name: Unused dependencies
        run: composer analyze:unused

      # phpcpd conflicts with PHPUnit 11 (sebastian/cli-parser), so it is installed globally.
      - name: Install phpcpd
        run: |
          composer global require --no-interaction sebastian/phpcpd:^6.0
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Duplicate code
        run: phpcpd --fuzzy --exclude tests --exclude vendor .

      - name: Platform requirements
        run: composer check-platform-reqs

      - name: Psalm
        run: composer analyze:psalm

      - name: PHP Mess Detector
        run: composer analyze:phpmd

  # getkirby/php-cs needs PHP 8.3 or newer, so it is installed globally and
  # not as a dependency: the package itself supports PHP 8.2.
  style:
    name: Code style, PHP 8.4
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install php-cs
        run: |
          composer global require --no-interaction getkirby/php-cs:0.2.1
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Check code style
        run: kirby-cs fix --dry-run --diff
